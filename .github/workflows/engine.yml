# El motor es Kotlin puro: se prueba sin SDK de Android, sin emulador y sin
# dispositivo, que es justo por lo que es un módulo aparte. Esto es lo que
# comprueba que las constantes copiadas de prdrive siguen dando lo mismo.
name: engine

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Las máquinas de GitHub traen un SDK de Android, y con él settings.gradle.kts
    # metería el módulo app. El motor no lo necesita: que se vea.
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :engine:test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-de-tests
          path: engine/build/reports/tests/test/

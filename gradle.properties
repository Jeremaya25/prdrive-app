# Con los 512 MiB de serie, el demonio se queda sin Metaspace al compilar el APK
# de release (lo avisa al acabar, y en una máquina del CI con menos margen puede
# caerse a medias).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true

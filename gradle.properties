org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Android: AndroidX es la única opción desde hace años, pero AGP sigue pidiendo
# que se diga. `nonTransitiveRClass` es el valor por defecto de AGP 8 y se
# escribe para que no dependa de la versión.
android.useAndroidX=true
android.nonTransitiveRClass=true
